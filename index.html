<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Un compteur de clics simple" />
    <title>Compteur de Clics</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Mon Compteur de Clics</h1>
    <div class="compteur">
      <span id="count">0</span>
    </div>
    <button id="btn-plus">+1</button>
    <button id="btn-moins">-1</button>
    <button id="btn-reset">Reset</button>
    <br />
    <button id="btn-theme">Mode sombre</button>
    <br />
    <img id="img-surprise" />
    <footer>
      <p>Fait avec ❤️</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
